name: sync upstream

# Merges laravel/horizon's 5.x into this fork's 5.x once the Linux and Windows
# suites pass against the merged code. Conflicts and failures open an issue.
#
# GITHUB_TOKEN cannot push commits that change files in .github/workflows.
# When upstream changes a workflow, the push fails and an issue is opened,
# unless a SYNC_TOKEN secret (a token with contents and workflows write
# access to this repository) is configured.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/laravel/horizon.git
  BRANCH: 5.x

jobs:
  check:
    runs-on: ubuntu-24.04

    outputs:
      status: ${{ steps.merge.outputs.status }}
      base: ${{ steps.merge.outputs.base }}
      upstream: ${{ steps.merge.outputs.upstream }}
      conflicts: ${{ steps.merge.outputs.conflicts }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Try the merge
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "$UPSTREAM" "$BRANCH"
          upstream=$(git rev-parse FETCH_HEAD)
          base=$(git rev-parse HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo "status=current" >> "$GITHUB_OUTPUT"
            echo "Already contains laravel/horizon $BRANCH at $upstream."
          elif git merge --no-ff --no-edit -m "Merge laravel/horizon $BRANCH at $upstream" "$upstream"; then
            echo "status=mergeable" >> "$GITHUB_OUTPUT"
            git diff --stat "$base" HEAD
          else
            conflicts=$(git diff --name-only --diff-filter=U | paste -sd ' ' -)
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
            echo "Merge conflicts: $conflicts"
          fi

  linux:
    needs: check
    if: needs.check.outputs.status == 'mergeable'
    runs-on: ubuntu-22.04

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: [12, 13]
        exclude:
          - php: 8.2
            laravel: 13

    name: Linux - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "$UPSTREAM" ${{ needs.check.outputs.upstream }}
          git merge --no-ff --no-edit -m "Merge laravel/horizon $BRANCH at ${{ needs.check.outputs.upstream }}" FETCH_HEAD

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, redis, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with="illuminate/contracts:^${{ matrix.laravel }}"

      - name: Execute tests
        run: vendor/bin/phpunit --fail-on-risky --fail-on-warning --stop-on-error --stop-on-failure --fail-on-deprecation

  windows:
    needs: check
    if: needs.check.outputs.status == 'mergeable'
    uses: ./.github/workflows/windows-tests.yml
    with:
      base-sha: ${{ needs.check.outputs.base }}
      upstream-sha: ${{ needs.check.outputs.upstream }}

  publish:
    needs: [check, linux, windows]
    if: needs.check.outputs.status == 'mergeable'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.base }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "$UPSTREAM" ${{ needs.check.outputs.upstream }}
          git merge --no-ff --no-edit -m "Merge laravel/horizon $BRANCH at ${{ needs.check.outputs.upstream }}" FETCH_HEAD
          # Not forced: this is rejected if the fork's branch moved since the check.
          git push origin "HEAD:refs/heads/$BRANCH"

  report:
    needs: [check, linux, windows, publish]
    if: always() && (needs.check.outputs.status == 'conflict' || contains(needs.*.result, 'failure'))
    runs-on: ubuntu-24.04

    permissions:
      issues: write

    steps:
      - name: Open or update the sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ needs.check.outputs.status }}
          CONFLICTS: ${{ needs.check.outputs.conflicts }}
          UPSTREAM_SHA: ${{ needs.check.outputs.upstream }}
          BASE_SHA: ${{ needs.check.outputs.base }}
          RESULTS: "check=${{ needs.check.result }} linux=${{ needs.linux.result }} windows=${{ needs.windows.result }} publish=${{ needs.publish.result }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream sync needs attention"
          if [ "$STATUS" = "conflict" ]; then
            reason="Merging laravel/horizon \`$UPSTREAM_SHA\` into \`$BASE_SHA\` conflicts in: $CONFLICTS"
          else
            reason="The merge of laravel/horizon \`$UPSTREAM_SHA\` was not published ($RESULTS). If only publish failed, upstream may have changed a workflow file, which needs a SYNC_TOKEN secret or a manual merge."
          fi
          body=$(printf '%s\n\nRun: %s\n\nTo merge by hand: `git fetch https://github.com/laravel/horizon.git 5.x && git merge FETCH_HEAD`, fix and push to 5.x.' "$reason" "$RUN_URL")

          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
